name: Fix homepage SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage canonical and home links
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<link rel="canonical" href="https://hiremenowresumes.ca/index.html" />', '<link rel="canonical" href="https://hiremenowresumes.ca/" />')
          html = html.replace('<link rel="canonical" href="https://hiremenowresumes.ca/index.html">', '<link rel="canonical" href="https://hiremenowresumes.ca/">')
          html = html.replace('href="/index.html"', 'href="/"')
          html = html.replace('href="index.html"', 'href="/"')
          html = html.replace('href="https://hiremenowresumes.ca/index.html"', 'href="https://hiremenowresumes.ca/"')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage canonical and home links"
          git push

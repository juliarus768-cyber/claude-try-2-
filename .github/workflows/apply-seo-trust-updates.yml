name: Apply SEO and trust updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article bylines, LinkedIn, testimonials, resources, and home links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          LINKEDIN = 'https://ca.linkedin.com/in/yulia-cher-84745720'
          TODAY = '2026-06-05'
          DISPLAY_UPDATED = 'June 5, 2026'

          article_files = {
              'resume-photo-fancy-design-canada.html': ('Should You Use a Fancy Resume Design or Add a Photo to Your Resume in Canada?', '2026-05-28'),
              'why-employers-dont-call-back-after-interview-star-method.html': ('Why Employers Don’t Call Back After Interviews', '2026-05-28'),
              'do-you-still-need-cover-letter-canada.html': ('Do You Still Need a Cover Letter in Canada?', '2026-05-28'),
              'how-to-explain-employment-gaps-canadian-resume.html': ('How to Explain Employment Gaps on a Canadian Resume', '2026-05-28'),
              'optimize-linkedin-canadian-job-market.html': ('How to Optimize LinkedIn for the Canadian Job Market', '2026-05-28'),
              'ats-resume-tips-canadian-job-seekers.html': ('ATS Resume Tips for Canadian Job Seekers', '2026-05-28'),
          }

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def normalize_home_links(html):
              html = html.replace('href="index.html"', 'href="/"')
              html = html.replace('href="/index.html"', 'href="/"')
              html = html.replace('href="https://hiremenowresumes.ca/index.html"', 'href="https://hiremenowresumes.ca/"')
              return html

          def ensure_article_schema(html, filename, headline, published):
              canonical = f'https://hiremenowresumes.ca/{filename}'
              desc_match = re.search(r'<meta name="description" content="([^"]+)"', html)
              description = desc_match.group(1) if desc_match else headline
              schema = {
                  '@context': 'https://schema.org',
                  '@type': 'Article',
                  'headline': headline,
                  'description': description,
                  'author': {'@type': 'Person', 'name': 'Julia Cher', 'jobTitle': 'Certified Resume Strategist', 'sameAs': LINKEDIN},
                  'publisher': {'@type': 'Organization', 'name': 'Hire Me Now Resumes', 'url': 'https://hiremenowresumes.ca/'},
                  'mainEntityOfPage': canonical,
                  'datePublished': published,
                  'dateModified': TODAY,
                  'image': 'https://hiremenowresumes.ca/og-image.jpg'
              }
              schema_html = '<script type="application/ld+json">\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n  </script>'
              article_blocks = list(re.finditer(r'<script type="application/ld\+json">\s*\{[\s\S]*?"@type"\s*:\s*"Article"[\s\S]*?</script>', html))
              if article_blocks:
                  first = article_blocks[0]
                  html = html[:first.start()] + schema_html + html[first.end():]
              else:
                  html = html.replace('</head>', schema_html + '\n</head>')
              return html

          def ensure_byline(html, published):
              if 'class="article-byline"' in html:
                  return html
              byline = f'<p class="article-byline" style="font-size:0.95rem;color:var(--muted);margin:0 0 28px;">By <a href="{LINKEDIN}" target="_blank" rel="noopener">Julia Cher, CRS</a> · Published {published} · Updated {DISPLAY_UPDATED}</p>'
              html = re.sub(r'(<article\s+class="container"[^>]*>)', r'\1\n    ' + byline, html, count=1)
              return html

          for filename, (headline, published) in article_files.items():
              p = Path(filename)
              if not p.exists():
                  continue
              html = read(p)
              html = normalize_home_links(html)
              html = ensure_article_schema(html, filename, headline, published)
              html = ensure_byline(html, published)
              write(p, html)

          # About page LinkedIn links and Person schema sameAs.
          about = read('about.html')
          about = normalize_home_links(about)
          about = about.replace('"knowsAbout": ["Canadian labour market", "resume writing", "job search strategy", "career coaching", "LinkedIn optimization"]', '"knowsAbout": ["Canadian labour market", "resume writing", "job search strategy", "career coaching", "LinkedIn optimization"],\n    "sameAs": "' + LINKEDIN + '"')
          about = about.replace('"url":"https://hiremenowresumes.ca/about.html"}', '"url":"https://hiremenowresumes.ca/about.html","sameAs":"' + LINKEDIN + '"}')
          if 'View Julia on LinkedIn' not in about:
              about = about.replace('Work With Julia</a>', 'Work With Julia</a>\n        <a href="' + LINKEDIN + '" class="btn btn-outline btn-arrow" style="margin-top:8px;" aria-label="View Julia Cher on LinkedIn" target="_blank" rel="noopener">View Julia on LinkedIn</a>', 1)
          write('about.html', about)

          # Add LinkedIn link to footers across site pages.
          for p in Path('.').glob('*.html'):
              html = read(p)
              html = normalize_home_links(html)
              if '<h4>Connect</h4>' not in html and '<footer class="site-footer"' in html:
                  html = html.replace('<div class="footer-col">\n        <h4>Legal</h4>', '<div class="footer-col">\n        <h4>Connect</h4>\n        <a href="' + LINKEDIN + '" target="_blank" rel="noopener">Julia on LinkedIn</a>\n      </div>\n      <div class="footer-col">\n        <h4>Legal</h4>', 1)
              write(p, html)

          # Homepage testimonial credibility context.
          index = read('index.html')
          index = normalize_home_links(index)
          index = index.replace('Newcomer from Ukraine · Toronto, ON</div>', 'Newcomer client · Administrative support target roles · Toronto, ON · 2026 feedback</div>')
          index = index.replace('International Students & New Graduates · Vancouver, BC</div>', 'International student · Early-career business roles · Vancouver, BC · 2026 feedback</div>')
          index = index.replace('Career Changer · Ottawa, ON</div>', 'Career changer · Operations and coordination roles · Ottawa, ON · 2026 feedback</div>')
          write('index.html', index)

          # Resources hub: strengthen each card to 1-2 sentence excerpts.
          resources = read('resources.html')
          resources = normalize_home_links(resources)
          replacements = {
              'Learn how ATS systems process resumes, whether photos are appropriate on Canadian resumes, and why simple resume formatting often performs better.': 'Learn how ATS systems and Canadian recruiters read resume layouts, photos, graphics, and templates. This guide explains why a cleaner format often protects credibility and improves readability.',
              'Learn how Canadian employers use structured interview scoring systems and why the STAR method helps candidates perform better.': 'Learn why strong candidates can lose momentum after interviews, even when their experience is relevant. This article explains structured scoring, clearer examples, and how the STAR method helps Canadian employers evaluate fit.',
              'Learn when cover letters still matter, which Canadian employers expect them, and how to write a targeted cover letter that supports your resume.': 'Learn when cover letters still matter in Canada and when they are unlikely to change the result. The guide shows how to write a focused letter that supports your resume instead of repeating it.',
              'Learn how to explain employment gaps on a Canadian resume, what to include, what to leave out, and how to position your experience with confidence.': 'Learn how to explain employment gaps on a Canadian resume without over-sharing or sounding defensive. This guide covers layoffs, caregiving, immigration, training, health breaks, and career transitions.',
              'Learn how to improve your LinkedIn profile for the Canadian job market, including headline tips, About section strategy, keywords, experience, and recruiter visibility.': 'Learn how to improve your LinkedIn profile for the Canadian job market, from your headline and About section to keywords, experience, and recruiter visibility. The focus is a consistent story across your profile and resume.',
              'Learn practical ATS resume tips for Canadian job seekers, including formatting, keywords, job titles, skills, and common resume mistakes to avoid.': 'Learn practical ATS resume tips for Canadian job seekers, including formatting, keywords, job titles, skills, and common mistakes. The goal is a resume that works for both software and the human recruiter reading it.'
          }
          for old, new in replacements.items():
              resources = resources.replace(old, new)
          write('resources.html', resources)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No SEO/trust changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add article bylines and trust signals"
          git push

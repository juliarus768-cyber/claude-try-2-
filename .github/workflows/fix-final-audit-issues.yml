name: Fix final audit issues

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch broken links, About schema, H1s, and contact form
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          LINKEDIN = 'https://ca.linkedin.com/in/yulia-cher-84745720'
          EMAIL = 'info@hiremenowresumes.ca'

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')

          # Fix confirmed 404 links on interview article.
          p = Path('why-employers-dont-call-back-after-interview-star-method.html')
          html = read(p)
          html = html.replace('href="interview-preparation.html"', 'href="services.html#addons"')
          html = html.replace('href="resume-review.html"', 'href="services.html"')
          write(p, html)

          # Clean About page: one H1, one complete Person schema.
          about = read('about.html')
          start = about.find('<script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "Person"')
          if start != -1:
              next_start = about.find('<script type="application/ld+json">', start + 1)
              end = about.find('<!-- Google tag', start)
              if end != -1:
                  person = {
                      '@context': 'https://schema.org',
                      '@type': 'Person',
                      'name': 'Julia Cher',
                      'jobTitle': 'Certified Resume Strategist',
                      'url': 'https://hiremenowresumes.ca/about.html',
                      'sameAs': LINKEDIN,
                      'worksFor': {'@type': 'Organization', 'name': 'Hire Me Now Resumes', 'url': 'https://hiremenowresumes.ca/'},
                      'knowsAbout': ['Canadian labour market', 'resume writing', 'job search strategy', 'career coaching', 'LinkedIn optimization', 'interview preparation'],
                      'knowsLanguage': ['English', 'Russian', 'Spanish', 'Hebrew', 'Cantonese', 'Bengali', 'Hindi', 'Urdu']
                  }
                  block = '<script type="application/ld+json">\n' + json.dumps(person, ensure_ascii=False, indent=2) + '\n  </script>\n'
                  about = about[:start] + block + about[end:]
          about = about.replace('<h1>Strategy built on<br><em>real experience</em></h1>', '<h2>Strategy built on<br><em>real experience</em></h2>')
          write('about.html', about)

          # Replace mailto form action with hosted form submission while retaining direct email fallback.
          contact = read('contact.html')
          contact = contact.replace(
              '<form action="mailto:info@hiremenowresumes.ca" method="post" enctype="text/plain" class="contact-form">',
              '<form action="https://formsubmit.co/info@hiremenowresumes.ca" method="POST" class="contact-form">\n            <input type="hidden" name="_subject" value="New Hire Me Now website inquiry">\n            <input type="hidden" name="_captcha" value="false">\n            <input type="hidden" name="_template" value="table">'
          )
          contact = contact.replace(
              '<button type="submit" class="btn btn-gold btn-submit">Send Message</button>',
              '<button type="submit" class="btn btn-gold btn-submit">Send Message</button>\n            <p style="font-size:13px;color:var(--muted);margin-top:12px;">Prefer email? Write directly to <a href="mailto:info@hiremenowresumes.ca">info@hiremenowresumes.ca</a>.</p>'
          )
          write('contact.html', contact)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No final audit changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix final audit issues"
          git push
